# Contract documents -> OpenSearch (BM25 nori + 384-dim vectors).
# Any stage can be replaced with `module:function` or `{fn: module:function, opt: value}`.
parse:
  fn: folio.parse:default
  backend: auto          # FOLIO_STRUCTURE_URL set -> HTTP structure server, else heuristic
  ocr_fallback: true
  vlm: auto              # FOLIO_VLM_URL set -> VLM for scanned pages/images/figures/complex tables, else OCR
chunk:
  fn: folio.chunk:adaptive   # largest structural unit within max_tokens; alternatives: folio.chunk:page|fixed
  max_tokens: 1024
  min_tokens: 128
map: mappers:map_contract
embed:
  fn: folio.embed:http   # FOLIO_EMBED_URL / FOLIO_EMBED_MODEL
  batch_size: 64
sink:
  type: opensearch
  index: contracts
retrieval:                 # POST /v1/search and folio.pipeline.search defaults
  mode: hybrid             # hybrid | bm25 | vector
  k: 10
  fields: {content: 1, contract_no: 3, party: 2}   # BM25 weights (OpenSearch)
  # rerank: {fn: folio.retrieval.rerank:http_rerank, top_n: 10}   # needs FOLIO_RERANK_URL
  # required_filters: [tenant_id]                                 # reject searches without it
storage: ${FOLIO_STORAGE_URI:-.folio/artifacts}
