[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.1.0"
description = "Document → search index pipeline with fixed stage contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pillow>=10",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "markdown-it-py>=3.0",
  "charset-normalizer>=3.3",
]

[project.optional-dependencies]
opensearch = ["opensearch-py>=2.6"]
milvus = ["pymilvus>=2.5"]
pgvector = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]
docling = ["docling>=2.50"]
ppstructure = ["paddleocr[doc-parser]>=3.7,<3.8"]  # + paddlepaddle (cpu) or paddlepaddle-gpu, see Dockerfile.structure
ocr = ["rapidocr-onnxruntime>=1.3"]
anthropic = ["anthropic>=1.17"]  # generation.chat: folio.generation.anthropic:chat
app = ["folio[service]", "authlib>=1.3", "itsdangerous>=2.1"]  # apps/chat: SSO chat app over /v1/chat
all = ["folio[opensearch,milvus,pgvector,s3,service]"]
dev = ["folio[all,app,anthropic]", "pytest>=8", "jsonschema>=4", "ruff>=0.6", "python-docx>=1.1"]

[project.scripts]
folio = "folio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["folio", "service", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs external services (docker containers)",
  "slow: needs heavy model backends",
]
addopts = "-m 'not integration and not slow'"

[tool.ruff]
line-length = 110
target-version = "py311"
