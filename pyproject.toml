[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.1.0"
description = "Document → search index pipeline with fixed stage contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pillow>=10",
]

[project.optional-dependencies]
opensearch = ["opensearch-py>=2.6"]
milvus = ["pymilvus>=2.5"]
pgvector = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]
docling = ["docling>=2.50"]
ppstructure = ["paddleocr>=3.2"]
all = ["folio[opensearch,milvus,pgvector,s3,service]"]
dev = ["folio[all]", "pytest>=8", "jsonschema>=4", "ruff>=0.6"]

[project.scripts]
folio = "folio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["folio", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs external services (docker containers)",
  "slow: needs heavy model backends",
]
addopts = "-m 'not integration and not slow'"

[tool.ruff]
line-length = 110
target-version = "py311"
