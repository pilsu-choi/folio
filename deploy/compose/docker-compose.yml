# folio Docker Compose stack.
#   cp .env.example .env   # then fill in the passwords (compose refuses to start without them)
#   docker compose up -d --build
#
# Profiles (set COMPOSE_PROFILES in .env):
#   infra : bundled PostgreSQL / RabbitMQ / OpenSearch / MinIO. Drop it to use external infra (FR-25):
#           set FOLIO_DATABASE_URL, FOLIO_BROKER_URL, OPENSEARCH_URL, S3_ENDPOINT_URL, ... in .env.
#   gpu   : PP-StructureV3 structure server on GPU (default; NVIDIA container toolkit).
#   cpu   : PP-StructureV3 on CPU (no GPU).     dev : model-free heuristic structure server (dev / CI).
#   vlm-stub, airflow : optional dev services (see below).
# The same environment-variable contract is used by the Helm chart (docs/INTERFACES.md).
#
# WARNING: OpenSearch security is DISABLED here (plain http, no auth) - this is for dev / closed networks only.
# Production: use external, secured OpenSearch and set OPENSEARCH_URL/OPENSEARCH_USER/OPENSEARCH_PASSWORD.

name: folio

x-image-folio: &image-folio ${FOLIO_REGISTRY:-}folio:${FOLIO_TAG:-0.1.0}
x-build-folio: &build-folio
  context: ../..
  dockerfile: deploy/docker/Dockerfile

x-folio-env: &folio-env
  FOLIO_CONFIG_DIR: /app/project
  FOLIO_LOG_LEVEL: ${FOLIO_LOG_LEVEL:-INFO}
  FOLIO_DATABASE_URL: ${FOLIO_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-folio}}
  PGVECTOR_DSN: ${PGVECTOR_DSN:-postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-folio}}
  FOLIO_BROKER_URL: ${FOLIO_BROKER_URL:-amqp://${RABBITMQ_USER:-folio}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672//}
  OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
  OPENSEARCH_USER: ${OPENSEARCH_USER:-}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
  MILVUS_URI: ${MILVUS_URI:-}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-folio}}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  FOLIO_STORAGE_URI: ${FOLIO_STORAGE_URI:-s3://${FOLIO_BUCKET:-folio-artifacts}}
  FOLIO_STRUCTURE_URL: ${FOLIO_STRUCTURE_URL:-http://structure:9000}
  FOLIO_CONVERT_URL: ${FOLIO_CONVERT_URL:-http://convert:9100}
  # Embedding: defaults to the bundled stub. For a real TEI / vLLM endpoint set FOLIO_EMBED_URL
  # (OpenAI-compatible base ending in /v1), FOLIO_EMBED_MODEL and FOLIO_EMBED_API_KEY in .env.
  FOLIO_EMBED_URL: ${FOLIO_EMBED_URL:-http://embed:8001/v1}
  FOLIO_EMBED_MODEL: ${FOLIO_EMBED_MODEL:-stub}
  FOLIO_EMBED_API_KEY: ${FOLIO_EMBED_API_KEY:-}
  FOLIO_VLM_URL: ${FOLIO_VLM_URL:-}
  FOLIO_VLM_MODEL: ${FOLIO_VLM_MODEL:-}
  FOLIO_RERANK_URL: ${FOLIO_RERANK_URL:-}
  # Chat LLM for pipelines with `generation:` (POST /v1/chat): OpenAI-compatible base ending in /v1 (e.g. vLLM).
  FOLIO_LLM_URL: ${FOLIO_LLM_URL:-}
  FOLIO_LLM_MODEL: ${FOLIO_LLM_MODEL:-}
  FOLIO_LLM_API_KEY: ${FOLIO_LLM_API_KEY:-}

x-app: &app
  image: *image-folio
  build: *build-folio
  environment: *folio-env
  volumes:
    - ${FOLIO_PROJECT_DIR:-../../project-template}:/app/project:ro
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped

services:
  postgres:
    profiles: [infra]
    image: ${FOLIO_REGISTRY:-}postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-folio}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    profiles: [infra]
    image: ${FOLIO_REGISTRY:-}rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-folio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  opensearch:
    profiles: [infra]
    image: ${FOLIO_REGISTRY:-}folio-opensearch:${FOLIO_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.opensearch
    environment:
      discovery.type: single-node
      # DEV ONLY: security plugin disabled (see warning at top of this file).
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  minio:
    profiles: [infra]
    image: ${FOLIO_REGISTRY:-}cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136  # minio/minio is no longer published on Docker Hub
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-folio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Structure analysis server (PP-StructureV3). One profile per variant; all share the network alias `structure`,
  # so FOLIO_STRUCTURE_URL stays http://structure:9000:
  #   gpu (default) - PP-StructureV3 on 1 NVIDIA GPU (host needs the NVIDIA container toolkit)
  #   cpu           - PP-StructureV3 on CPU, for hosts without a GPU (same blocks/tables, ~40x slower, ~12 GB RAM)
  #   dev           - model-free heuristic backend, for local development / CI
  # Model weights live in the `models` volume (not baked into the image); the offline bundle can pre-populate it.
  # /readyz turns healthy only after the weights are loaded (first start downloads them unless pre-populated).
  structure-gpu: &structure
    profiles: [gpu]
    image: ${FOLIO_REGISTRY:-}folio-structure:${FOLIO_TAG:-0.1.0}-gpu
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.structure
      args: {BACKEND: ppstructure, DEVICE: gpu}
    environment:
      FOLIO_STRUCTURE_BACKEND: ppstructure
      FOLIO_STRUCTURE_DEVICE: gpu
    shm_size: 2gb
    volumes:
      - ${FOLIO_MODELS_DIR:-models}:/models
    networks:
      default:
        aliases: [structure]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  structure-cpu:
    <<: *structure
    profiles: [cpu]
    image: ${FOLIO_REGISTRY:-}folio-structure:${FOLIO_TAG:-0.1.0}-cpu
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.structure
      args: {BACKEND: ppstructure, DEVICE: cpu}
    environment:
      FOLIO_STRUCTURE_BACKEND: ppstructure
      FOLIO_STRUCTURE_DEVICE: cpu
      # Bound inference threads so a GPU-less host is not saturated; keep in line with `cpus` below.
      FOLIO_STRUCTURE_CPU_THREADS: ${FOLIO_STRUCTURE_CPU_THREADS:-4}
      OMP_NUM_THREADS: ${FOLIO_STRUCTURE_CPU_THREADS:-4}
    cpus: ${FOLIO_STRUCTURE_CPUS:-4}
    mem_limit: ${FOLIO_STRUCTURE_MEMORY:-14g}   # measured peak 11.6 GiB with 4 threads
    deploy: {}

  structure-dev:
    <<: *structure
    profiles: [dev]
    image: ${FOLIO_REGISTRY:-}folio-structure:${FOLIO_TAG:-0.1.0}-heuristic
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.structure
      args: {BACKEND: heuristic, DEVICE: cpu}
    environment:
      FOLIO_STRUCTURE_BACKEND: heuristic
    shm_size: 64m
    deploy: {}

  # DOCX/HWPX (and PPTX convert mode) -> PDF server: LibreOffice + rhwp + open fonts (FR-20), all profiles.
  # Customer-licensed fonts: add a read-only volume `- /path/to/fonts:/usr/share/fonts/custom:ro`.
  convert:
    image: ${FOLIO_REGISTRY:-}folio-convert:${FOLIO_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.convert
    command: ["convert-server", "--port", "9100"]
    environment:
      FOLIO_LOG_LEVEL: ${FOLIO_LOG_LEVEL:-INFO}
      FOLIO_CONVERT_WORKERS: ${FOLIO_CONVERT_WORKERS:-2}
      FOLIO_CONVERT_TIMEOUT: ${FOLIO_CONVERT_TIMEOUT:-300}
      HOME: /tmp
    cpus: ${FOLIO_CONVERT_CPUS:-2}
    mem_limit: ${FOLIO_CONVERT_MEMORY:-3g}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/readyz', timeout=10).status == 200 else 1)"]
      interval: 10s
      timeout: 15s
      retries: 20
    restart: unless-stopped

  # Deterministic dev embedding server. To use a real endpoint instead, set FOLIO_EMBED_URL / FOLIO_EMBED_MODEL /
  # FOLIO_EMBED_API_KEY in .env (e.g. http://tei:80/v1) and stop this service: `docker compose stop embed`.
  embed:
    <<: *app
    command: ["embed-stub", "--port", "8001"]
    volumes: []
    environment:
      FOLIO_LOG_LEVEL: ${FOLIO_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Dev VLM stub (deterministic, not a model): profile `vlm-stub` + FOLIO_VLM_URL=http://vlm:8002/v1 in .env.
  # Real VLM: run an OpenAI-compatible server (e.g. vLLM) and point FOLIO_VLM_URL/FOLIO_VLM_MODEL at it.
  vlm:
    <<: *app
    profiles: [vlm-stub]
    command: ["vlm-stub", "--port", "8002"]
    volumes: []
    environment:
      FOLIO_LOG_LEVEL: ${FOLIO_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot: creates the storage bucket / jobs tables, then applies index schemas.
  init:
    <<: *app
    command: ["init"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: {condition: service_healthy, required: false}
      rabbitmq: {condition: service_healthy, required: false}
      opensearch: {condition: service_healthy, required: false}
      minio: {condition: service_healthy, required: false}

  api:
    <<: *app
    command: ["api"]
    ports:
      - "${FOLIO_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      init: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *folio-env
      FOLIO_WORKER_CONCURRENCY: ${FOLIO_WORKER_CONCURRENCY:-2}
    # SIGTERM = Celery warm shutdown: finish the running task before exiting.
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "celery -A service.worker:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 30s
    depends_on:
      init: {condition: service_completed_successfully}

  # Airflow metadata DB (profile `airflow`): database + owner `airflow` on the bundled postgres, re-runnable.
  # Same statements as the Helm init Job's create-databases step (deploy/helm/folio/templates/_helpers.tpl): keep in sync.
  # External DB: set AIRFLOW_DATABASE_URL and this service does nothing.
  airflow-db:
    image: ${FOLIO_REGISTRY:-}postgres:16
    profiles: [airflow]
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-folio}
      PGDATABASE: ${POSTGRES_DB:-folio}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_AIRFLOW_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-}
      AIRFLOW_DATABASE_URL: ${AIRFLOW_DATABASE_URL:-}
    command:
      - sh
      - -c
      - |
        set -e
        if [ -n "$$AIRFLOW_DATABASE_URL" ]; then echo "AIRFLOW_DATABASE_URL is set: external DB, nothing to do"; exit 0; fi
        [ -n "$$POSTGRES_AIRFLOW_PASSWORD" ] || { echo "set POSTGRES_AIRFLOW_PASSWORD in .env" >&2; exit 1; }
        psql -X -v ON_ERROR_STOP=1 -v db=airflow -v usr=airflow -v pw="$$POSTGRES_AIRFLOW_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'usr') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'usr')\gexec
        ALTER ROLE :"usr" WITH LOGIN PASSWORD :'pw';
        SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'usr') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
        SQL
        echo "database airflow ready"
    depends_on:
      postgres: {condition: service_healthy, required: false}

  # Example Airflow (FR-15), profile `airflow`: `airflow standalone` (metadata in the bundled postgres, dev only).
  # The DAG runs `folio run` in a sibling folio container through the host Docker socket (DockerOperator), so the
  # Airflow image has no folio dependencies. Socket access = root on the host: dev / closed networks only.
  # DOCKER_GID: gid of /var/run/docker.sock as seen in containers (`stat -c %g`). FOLIO_DOCKER_NETWORK must be this
  # project's network (`<project>_default`) so the folio container reaches opensearch/minio/structure/embed.
  airflow:
    image: ${AIRFLOW_IMAGE:-apache/airflow:3.1.0-python3.12}
    profiles: [airflow]
    command: ["standalone"]
    environment:
      <<: *folio-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"  # dev: triggered runs start without unpausing
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-postgresql+psycopg2://airflow:${POSTGRES_AIRFLOW_PASSWORD:-}@postgres:5432/airflow}
      FOLIO_IMAGE: *image-folio
      FOLIO_AIRFLOW_RUNNER: docker
      FOLIO_DOCKER_NETWORK: ${FOLIO_DOCKER_NETWORK:-folio_default}
    volumes:
      - ${FOLIO_PROJECT_DIR:-../../project-template}/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-0}"]
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      init: {condition: service_completed_successfully}
      airflow-db: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pg-data:
  rabbit-data:
  os-data:
  minio-data:
  models:
