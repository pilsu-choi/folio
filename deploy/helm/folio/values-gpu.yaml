# Overlay: schedule the (default) PP-StructureV3 GPU server on a dedicated GPU node pool with a persistent
# model cache. Requires the NVIDIA device plugin; adjust nodeSelector/tolerations to your cluster.
structure:
  backend: ppstructure
  gpu: {enabled: true, count: 1, resourceName: nvidia.com/gpu}
  models:
    type: pvc               # persistent model cache mounted at /models
    size: 30Gi
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {memory: 16Gi}
