{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "folio.fullname" . }}
  labels: {{- include "folio.labels" . | nindent 4 }}
  {{- include "folio.preHook" . | nindent 2 }}
type: Opaque
stringData: {{- include "folio.secretData" . | nindent 2 }}
{{- end }}
