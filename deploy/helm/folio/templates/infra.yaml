{{/* Bundled single-replica dev infra. No subcharts: works offline. NOT for production. */}}
{{- $fn := include "folio.fullname" . }}
{{- $sec := include "folio.secretName" . }}
{{- define "folio.infra.pvc" -}}
{{- if .p.persistence.enabled }}
volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .p.persistence.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests: {storage: {{ .p.persistence.size }}}
{{- end }}
{{- end -}}
{{- define "folio.infra.vol" -}}
{{- if not .persistence.enabled }}
volumes:
  - {name: data, emptyDir: {}}
{{- end }}
{{- end -}}

{{- if .Values.infra.postgres.enabled }}
{{- with .Values.infra.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "folio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fn }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "folio.selector" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "folio.selector" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      {{- include "folio.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "folio.image" (dict "root" $ "repository" .image.repository "tag" .image.tag) }}
          env:
            - {name: POSTGRES_USER, value: {{ .user | quote }}}
            - {name: POSTGRES_DB, value: {{ .database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $sec }}, key: POSTGRES_PASSWORD}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U {{ .user }} -d {{ .database }}"]}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {{- toYaml .resources | nindent 12 }}
      {{- include "folio.infra.vol" . | nindent 6 }}
  {{- include "folio.infra.pvc" (dict "p" .) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "folio.labels" $ | nindent 4 }}
spec:
  ports: [{name: pg, port: 5432}]
  selector: {{- include "folio.selector" (dict "root" $ "component" "postgres") | nindent 4 }}
---
{{- end }}
{{- end }}

{{- if .Values.infra.rabbitmq.enabled }}
{{- with .Values.infra.rabbitmq }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-rabbitmq
  labels: {{- include "folio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ $fn }}-rabbitmq
  replicas: 1
  selector:
    matchLabels: {{- include "folio.selector" (dict "root" $ "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "folio.selector" (dict "root" $ "component" "rabbitmq") | nindent 8 }}
    spec:
      {{- include "folio.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: rabbitmq
          image: {{ include "folio.image" (dict "root" $ "repository" .image.repository "tag" .image.tag) }}
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: {{ .user | quote }}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: {{ $sec }}, key: RABBITMQ_PASSWORD}}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: mgmt, containerPort: 15672}
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          resources: {{- toYaml .resources | nindent 12 }}
      {{- include "folio.infra.vol" . | nindent 6 }}
  {{- include "folio.infra.pvc" (dict "p" .) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-rabbitmq
  labels: {{- include "folio.labels" $ | nindent 4 }}
spec:
  ports:
    - {name: amqp, port: 5672}
    - {name: mgmt, port: 15672}
  selector: {{- include "folio.selector" (dict "root" $ "component" "rabbitmq") | nindent 4 }}
---
{{- end }}
{{- end }}

{{- if .Values.infra.opensearch.enabled }}
{{- with .Values.infra.opensearch }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-opensearch
  labels: {{- include "folio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ $fn }}-opensearch
  replicas: 1
  selector:
    matchLabels: {{- include "folio.selector" (dict "root" $ "component" "opensearch") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "folio.selector" (dict "root" $ "component" "opensearch") | nindent 8 }}
    spec:
      {{- include "folio.imagePullSecrets" $ | nindent 6 }}
      securityContext: {fsGroup: 1000}
      containers:
        - name: opensearch
          image: {{ include "folio.image" (dict "root" $ "repository" .image.repository "tag" (default $.Chart.AppVersion .image.tag)) }}
          env:
            - {name: discovery.type, value: single-node}
            # DEV ONLY: security plugin disabled (plain http, no auth). Use external secured OpenSearch in production.
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: {{ .javaOpts | quote }}}
          ports: [{name: http, containerPort: 9200}]
          readinessProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts: [{name: data, mountPath: /usr/share/opensearch/data}]
          resources: {{- toYaml .resources | nindent 12 }}
      {{- include "folio.infra.vol" . | nindent 6 }}
  {{- include "folio.infra.pvc" (dict "p" .) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-opensearch
  labels: {{- include "folio.labels" $ | nindent 4 }}
spec:
  ports: [{name: http, port: 9200}]
  selector: {{- include "folio.selector" (dict "root" $ "component" "opensearch") | nindent 4 }}
---
{{- end }}
{{- end }}

{{- if .Values.infra.minio.enabled }}
{{- with .Values.infra.minio }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-minio
  labels: {{- include "folio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ $fn }}-minio
  replicas: 1
  selector:
    matchLabels: {{- include "folio.selector" (dict "root" $ "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "folio.selector" (dict "root" $ "component" "minio") | nindent 8 }}
    spec:
      securityContext: {fsGroup: 65532}  # chainguard minio runs as uid 65532
      {{- include "folio.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: minio
          image: {{ include "folio.image" (dict "root" $ "repository" .image.repository "tag" .image.tag) }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: {{ .rootUser | quote }}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $sec }}, key: MINIO_ROOT_PASSWORD}}
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {{- toYaml .resources | nindent 12 }}
      {{- include "folio.infra.vol" . | nindent 6 }}
  {{- include "folio.infra.pvc" (dict "p" .) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-minio
  labels: {{- include "folio.labels" $ | nindent 4 }}
spec:
  ports:
    - {name: s3, port: 9000}
    - {name: console, port: 9001}
  selector: {{- include "folio.selector" (dict "root" $ "component" "minio") | nindent 4 }}
---
{{- end }}
{{- end }}

{{- if .Values.infra.milvus.enabled }}
{{- with .Values.infra.milvus }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-milvus
  labels: {{- include "folio.labels" $ | nindent 4 }}
    app.kubernetes.io/component: milvus
spec:
  serviceName: {{ $fn }}-milvus
  replicas: 1
  selector:
    matchLabels: {{- include "folio.selector" (dict "root" $ "component" "milvus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "folio.selector" (dict "root" $ "component" "milvus") | nindent 8 }}
    spec:
      {{- include "folio.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: milvus
          image: {{ include "folio.image" (dict "root" $ "repository" .image.repository "tag" .image.tag) }}
          args: ["milvus", "run", "standalone"]
          env:
            - {name: ETCD_USE_EMBED, value: "true"}
            - {name: ETCD_DATA_DIR, value: /var/lib/milvus/etcd}
            - {name: ETCD_CONFIG_PATH, value: /milvus/configs/embedEtcd.yaml}
            - {name: COMMON_STORAGETYPE, value: local}
          ports:
            - {name: grpc, containerPort: 19530}
            - {name: health, containerPort: 9091}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/milvus}]
          resources: {{- toYaml .resources | nindent 12 }}
      {{- include "folio.infra.vol" . | nindent 6 }}
  {{- include "folio.infra.pvc" (dict "p" .) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-milvus
  labels: {{- include "folio.labels" $ | nindent 4 }}
spec:
  ports: [{name: grpc, port: 19530}]
  selector: {{- include "folio.selector" (dict "root" $ "component" "milvus") | nindent 4 }}
---
{{- end }}
{{- end }}
