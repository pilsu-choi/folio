{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "folio.serviceAccountName" . }}
  labels: {{- include "folio.labels" . | nindent 4 }}
  {{- $ann := .Values.serviceAccount.annotations }}
  {{- if and .Values.init.enabled (eq .Values.init.mode "hook") }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with $ann }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- else if $ann }}
  annotations: {{- toYaml $ann | nindent 4 }}
  {{- end }}
{{- end }}
