# Overlay: clusters without GPUs. PP-StructureV3 on CPU (same output as GPU, much slower per page).
structure:
  backend: ppstructure
  gpu: {enabled: false}
  cpuThreads: 4             # matches the CPU request below; paddle otherwise uses every core
  resources:
    requests: {cpu: "4", memory: 6Gi}
    limits: {memory: 10Gi}
